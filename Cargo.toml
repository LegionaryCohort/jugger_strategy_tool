[package]
name = "jugger_strategy_tool"
version = "0.1.0"
edition = "2024"
authors = ["Mario Treiber <mariotreiber@gmail.com>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = { version = "0.18.1", features = ["serialize"] }
bevy_prototype_lyon = "0.16"
leafwing-input-manager = "0.20"
leptos = { version = "0.8.17", features = ["csr"] }
leptos_meta = { version = "0.8.6" }
leptos_router = { version = "0.8.13" }
leptos-bevy-canvas = "0.5.1"
console_log = "1"
log = "0.4.29"
console_error_panic_hook = "0.1"

# utils
# strum = { version = "0.25", features = ["derive", "strum_macros"] }
# strum_macros = "0.25"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-sys = { version = "0.31.10", features = ["dlopen"] }


[dev-dependencies]
wasm-bindgen = "0.2.115"
wasm-bindgen-test = "0.3.65"
web-sys = { version = "0.3.92", features = [
	"Document",
	"Window",
	"CanvasRenderingContext2d",
] }


[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"
